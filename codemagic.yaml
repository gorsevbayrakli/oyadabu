workflows:
  ios-testflight:
    name: OyadaBu — iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - appstore_credentials   # ASC_ISSUER_ID, ASC_KEY_ID, ASC_PRIVATE_KEY

      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: app.oyadabu.oyun
        APP_STORE_CONNECT_ISSUER_ID: $ASC_ISSUER_ID
        APP_STORE_CONNECT_KEY_IDENTIFIER: $ASC_KEY_ID
        APP_STORE_CONNECT_PRIVATE_KEY: $ASC_PRIVATE_KEY

      ios_signing:
        provisioning_profiles:
          - Codemagic_Profile
        certificates:
          - Gorsev_Distribution_Certificate

      node: 22.14.0
      xcode: latest

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Node bağımlılıklarını kur
        script: npm install

      - name: React uygulamasını derle
        script: npm run build

      - name: Capacitor iOS sync
        script: npx cap sync ios

      - name: Build numarasını artır
        script: |
          BUILD_NUMBER=$(date +%Y%m%d%H%M)
          echo "Build numarası: $BUILD_NUMBER"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.0" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/App/App/Info.plist

      - name: IPA oluştur
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - gorsevbayrakli@icloud.com
        notify:
          success: true
          failure: true
